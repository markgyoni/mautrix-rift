name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./pkg/...
      - run: go test -tags goolm ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The Go build cross-compiles natively (see Dockerfile); QEMU only runs the runtime image's
      # short apk/adduser step for arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> 1.2.3 and 1.2; main -> sha-<short>
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ github.ref_type == 'tag' && github.ref_name || 'unknown' }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags, to find the previous release
      - name: Generate changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          {
            echo "## Changes"
            echo
            git log --no-merges --reverse --format='- %s (%h)' "$range"
            echo
            [ -n "$prev" ] && echo "**Full changelog:** https://github.com/$REPO/compare/$prev...$TAG" && echo
            echo "## Docker image"
            echo
            echo '```'
            echo "docker pull ghcr.io/${REPO,,}:${TAG#v}"
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=$([[ $TAG == *-* ]] && echo --prerelease || true)
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $prerelease
